services:
  - type: web
    name: repara-codeday
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: repara-db
          property: connectionString
      - key: DEMO_MODE
        value: "0"
      - key: DEMO_ADMIN_PASSWORD
        sync: false

databases:
  - name: repara-db
    plan: free
