services:
  https:
    image: caddy:2-alpine
    environment:
      LAN_IP: ${LAN_IP:?Defini LAN_IP en el archivo .env con la IPv4 de tu computadora}
    ports:
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ciudad_caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped
volumes:
  ciudad_caddy_config:
