name: repara
services:
  web:
    build: .
    image: repara:v10
    ports:
      - "8081:8080"
    environment:
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      INCIDENT_RATE_LIMIT: ${INCIDENT_RATE_LIMIT:-10}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-8}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-8}
      PHOTOS_DIR: ${PHOTOS_DIR:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      AI_INPUT_USD_PER_MILLION: ${AI_INPUT_USD_PER_MILLION:-0}
      AI_OUTPUT_USD_PER_MILLION: ${AI_OUTPUT_USD_PER_MILLION:-0}
      DATABASE_URL: ${DATABASE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-nano}
      ALLOW_PUBLIC_DEMO: ${ALLOW_PUBLIC_DEMO:-0}
      DEMO_MODE: ${DEMO_MODE:-0}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_RIVERA_USER: ${DEMO_RIVERA_USER:-rivera}
      DEMO_LIVRAMENTO_USER: ${DEMO_LIVRAMENTO_USER:-livramento}
    volumes:
      - ciudad_data:/data
    restart: unless-stopped
volumes:
  ciudad_data:
