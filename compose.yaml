name: repara
services:
  web:
    build: .
    image: repara:v10
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-nano}
      DEMO_MODE: ${DEMO_MODE:-1}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-CiudadVisible2026!}
      DEMO_RIVERA_USER: ${DEMO_RIVERA_USER:-rivera}
      DEMO_LIVRAMENTO_USER: ${DEMO_LIVRAMENTO_USER:-livramento}
    volumes:
      - ciudad_data:/data
    restart: unless-stopped
volumes:
  ciudad_data:
